<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F8F7F3" />
  <meta name="description" content="SvasthNexis — Unified Healthcare Management Ecosystem connecting patients, doctors, hospitals, and care operations." />
  <title>SvasthNexis — Unified Healthcare Management Ecosystem</title>
  <style>
    :root {
      /* SVASTHNEXIS Brand Visual Identity System */
      /* Warm Ivory (55%) + White (25%) + Midnight Navy (10%) + Coral Red (6%) + Emerald Green (2%) + Golden Amber (2%) */
      --brand-ivory: #F8F7F3;
      --brand-white: #FFFFFF;
      --brand-warm-grey: #F1F0EC;
      --brand-border: #E7E5E0;
      --brand-border-dark: #D8D5CD;
      --brand-midnight: #171C2C;
      --brand-midnight-light: #252B3E;
      --brand-slate: #5A6275;
      --brand-coral: #FF5B47;
      --brand-coral-deep: #C94132; /* WCAG AA accessible on white */
      --brand-coral-soft: #FDECE9;
      --brand-emerald: #10B981;
      --brand-emerald-dark: #065F46;
      --brand-pale-mint: #EAF8F1;
      --brand-amber: #FBC024;
      --brand-amber-dark: #765000;
      --brand-amber-soft: #FFF7DF;
      --brand-muted-blue: #93A2B9;
      --brand-blue-soft: #EFF2F7;

      /* Signature Three-Stop Soft Hero Gradient */
      --hero-peach: #F9EBE8;
      --hero-blush-grey: #F4EEF0;
      --hero-cool-ivory: #EEF0F4;

      /* Shadows & Radii */
      --shadow-sm: 0 2px 8px rgba(23, 28, 44, 0.04);
      --shadow-md: 0 8px 24px rgba(23, 28, 44, 0.06);
      --shadow-lg: 0 16px 42px rgba(23, 28, 44, 0.08);
      --radius: 16px;
      --radius-sm: 10px;
      --sidebar-w: 260px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--brand-ivory);
      color: var(--brand-midnight);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    /* Layout Shell */
    .app-shell { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-w);
      background: var(--brand-white);
      border-right: 1px solid var(--brand-border);
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      overflow-y: auto;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 8px 20px;
      border-bottom: 1px solid var(--brand-border);
    }
    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand-coral), var(--brand-coral-deep));
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(201, 65, 50, 0.25);
    }
    .brand-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--brand-midnight);
      letter-spacing: -0.03em;
    }
    .brand-tag {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--brand-slate);
      font-weight: 700;
    }

    /* Workspace Switcher */
    .ws-selector {
      margin: 16px 0 12px;
      background: var(--brand-warm-grey);
      border: 1px solid var(--brand-border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .ws-selector:hover { border-color: var(--brand-coral); background: #FAF9F6; }
    .ws-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--brand-coral-soft);
      color: var(--brand-coral-deep);
      display: grid;
      place-items: center;
    }
    .ws-info strong { display: block; font-size: 12px; font-weight: 700; color: var(--brand-midnight); }
    .ws-info small { display: block; font-size: 10px; color: var(--brand-slate); }
    .ws-chevron { margin-left: auto; color: var(--brand-slate); }

    /* Navigation */
    .nav-label {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #8C93A3;
      padding: 12px 8px 6px;
    }
    .nav-list { display: flex; flex-direction: column; gap: 3px; }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 9px;
      border: 0;
      background: transparent;
      color: var(--brand-slate);
      font-size: 12px;
      font-weight: 600;
      text-align: left;
      transition: all 0.15s ease;
    }
    .nav-btn:hover { background: var(--brand-warm-grey); color: var(--brand-midnight); }
    .nav-btn.active {
      background: var(--brand-coral-soft);
      color: var(--brand-coral-deep);
      font-weight: 700;
    }
    .nav-badge {
      margin-left: auto;
      background: var(--brand-coral-deep);
      color: white;
      font-size: 9px;
      padding: 2px 7px;
      border-radius: 12px;
      font-weight: 700;
    }

    .sidebar-foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--brand-border); }
    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px;
    }
    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--brand-coral-soft);
      color: var(--brand-coral-deep);
      font-weight: 800;
      font-size: 12px;
      display: grid;
      place-items: center;
    }

    /* Main Shell */
    .main-wrap {
      flex: 1;
      margin-left: var(--sidebar-w);
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      height: 68px;
      background: var(--brand-white);
      border-bottom: 1px solid var(--brand-border);
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }
    .top-breadcrumb { font-size: 11px; color: var(--brand-slate); font-weight: 600; }
    .top-title { font-size: 16px; font-weight: 800; color: var(--brand-midnight); letter-spacing: -0.02em; }

    .top-actions { display: flex; align-items: center; gap: 14px; }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      background: var(--brand-pale-mint);
      color: var(--brand-emerald-dark);
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand-emerald); }

    /* Page Container */
    .container {
      max-width: 1540px;
      margin: 0 auto;
      padding: 28px 32px 60px;
      width: 100%;
    }

    /* Hero Section with Signature 3-Stop Gradient */
    .hero-banner {
      background: linear-gradient(115deg, var(--hero-peach) 0%, var(--hero-blush-grey) 50%, var(--hero-cool-ivory) 100%);
      border: 1px solid var(--brand-border);
      border-radius: 20px;
      padding: 28px 34px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
    }
    .hero-text h1 {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 800;
      color: var(--brand-midnight);
      letter-spacing: -0.04em;
    }
    .hero-text p {
      margin: 0 0 16px;
      font-size: 13px;
      color: var(--brand-slate);
      max-width: 580px;
      line-height: 1.6;
    }
    .hero-actions { display: flex; gap: 10px; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--brand-coral-deep);
      color: var(--brand-white);
      border-color: var(--brand-coral-deep);
      box-shadow: 0 2px 6px rgba(201, 65, 50, 0.2);
    }
    .btn-primary:hover {
      background: #B5372B;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(201, 65, 50, 0.3);
    }
    .btn-secondary {
      background: var(--brand-white);
      color: var(--brand-midnight);
      border-color: var(--brand-border);
    }
    .btn-secondary:hover { background: var(--brand-warm-grey); border-color: var(--brand-border-dark); }
    .btn-dark {
      background: var(--brand-midnight);
      color: white;
    }
    .btn-dark:hover { background: var(--brand-midnight-light); }
    .btn-sm { padding: 6px 11px; font-size: 11px; border-radius: 7px; }
    .btn-danger { background: #FDECE9; color: var(--brand-coral-deep); border-color: #F8CBC6; }

    /* Emergency Alert Banner */
    .emergency-banner {
      background: #FFF7F5;
      border: 1px solid #F5D3CD;
      border-left: 5px solid var(--brand-coral);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .emergency-info strong { display: block; font-size: 13px; color: var(--brand-coral-deep); }
    .emergency-info p { margin: 3px 0 0; font-size: 11px; color: #7A4E49; }

    /* Metric Cards Grid */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .metric-card {
      background: var(--brand-white);
      border: 1px solid var(--brand-border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
    }
    .metric-head { display: flex; justify-content: space-between; align-items: center; }
    .metric-label { font-size: 11px; font-weight: 700; color: var(--brand-slate); text-transform: uppercase; letter-spacing: 0.05em; }
    .metric-icon-wrap {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--brand-coral-soft);
      color: var(--brand-coral-deep);
      display: grid;
      place-items: center;
    }
    .metric-value {
      font-size: 26px;
      font-weight: 800;
      color: var(--brand-midnight);
      margin: 10px 0 4px;
      letter-spacing: -0.03em;
    }
    .metric-sub { font-size: 11px; color: var(--brand-slate); }
    .metric-sub.green { color: var(--brand-emerald-dark); font-weight: 700; }
    .metric-sub.coral { color: var(--brand-coral-deep); font-weight: 700; }

    /* Layout Grids */
    .main-grid {
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 20px;
      align-items: start;
    }
    .full-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    .col-stack { display: flex; flex-direction: column; gap: 20px; }

    /* White Cards */
    .card {
      background: var(--brand-white);
      border: 1px solid var(--brand-border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow-sm);
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    .card-head h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      color: var(--brand-midnight);
      letter-spacing: -0.02em;
    }
    .card-head p { margin: 3px 0 0; font-size: 11px; color: var(--brand-slate); }

    /* Pills & Badges */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .pill::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .pill-green { background: var(--brand-pale-mint); color: var(--brand-emerald-dark); }
    .pill-amber { background: var(--brand-amber-soft); color: var(--brand-amber-dark); }
    .pill-coral { background: var(--brand-coral-soft); color: var(--brand-coral-deep); }
    .pill-blue { background: var(--brand-blue-soft); color: #3B557A; }
    .pill-grey { background: var(--brand-warm-grey); color: var(--brand-slate); }

    /* Tables */
    .table-box {
      border: 1px solid var(--brand-border);
      border-radius: var(--radius-sm);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    th {
      background: var(--brand-warm-grey);
      color: var(--brand-slate);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 10px 14px;
      border-bottom: 1px solid var(--brand-border);
    }
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--brand-border);
      color: var(--brand-midnight);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: 0; }
    tr:hover td { background: #FAFAF7; }

    /* Bed Grid Visualization (Hospital HIS) */
    .bed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }
    .bed-box {
      border: 1px solid var(--brand-border);
      border-radius: var(--radius-sm);
      padding: 12px;
      text-align: center;
      transition: all 0.15s ease;
      background: var(--brand-white);
    }
    .bed-box.AVAILABLE { border-color: #BBEBD7; background: #F4FBF7; }
    .bed-box.OCCUPIED { border-color: #F8CBC6; background: #FFF7F5; }
    .bed-box.CLEANING { border-color: #F8E7B2; background: #FFFDF4; }
    .bed-number { font-size: 13px; font-weight: 800; color: var(--brand-midnight); }
    .bed-ward { font-size: 9px; color: var(--brand-slate); text-transform: uppercase; margin: 3px 0 6px; }

    /* AI Interactive Box */
    .ai-box {
      background: linear-gradient(135deg, #FFF9F7 0%, #F8F7F3 100%);
      border: 1px solid #F4D3CC;
      border-radius: var(--radius);
      padding: 18px;
    }
    .ai-head { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
    .ai-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--brand-coral);
      color: white;
      display: grid;
      place-items: center;
      font-size: 14px;
    }
    .ai-input {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .ai-input input {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid var(--brand-border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      background: white;
    }

    /* Forms & Inputs */
    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .form-group label { font-size: 11px; font-weight: 700; color: var(--brand-slate); text-transform: uppercase; letter-spacing: 0.04em; }
    .form-group input, .form-group select, .form-group textarea {
      padding: 8px 12px;
      border: 1px solid var(--brand-border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      background: var(--brand-warm-grey);
      color: var(--brand-midnight);
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--brand-coral);
      background: white;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(23, 28, 44, 0.45);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      place-items: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: grid; }
    .modal-card {
      background: white;
      border-radius: 18px;
      max-width: 580px;
      width: 100%;
      padding: 26px;
      box-shadow: var(--shadow-lg);
      max-height: 90vh;
      overflow-y: auto;
    }

    /* Toast */
    .toast-container { position: fixed; right: 24px; bottom: 24px; z-index: 110; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      background: var(--brand-midnight);
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 12px;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideIn 0.2s ease;
    }
    .toast.success { border-left: 4px solid var(--brand-emerald); }
    .toast.error { border-left: 4px solid var(--brand-coral); }
    @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* Responsive */
    @media (max-width: 1024px) {
      .metric-grid { grid-template-columns: repeat(2, 1fr); }
      .main-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-wrap { margin-left: 0; }
      .metric-grid { grid-template-columns: 1fr; }
      .top-bar { padding: 0 16px; }
      .container { padding: 18px 16px 40px; }
    }
  </style>
</head>
<body>

<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand-box">
      <div class="brand-logo">S</div>
      <div>
        <div class="brand-title">SvasthNexis</div>
        <div class="brand-tag">Connected Healthcare</div>
      </div>
    </div>

    <!-- 6 Role-Specific Workspaces Switcher -->
    <div class="ws-selector" onclick="openWorkspaceModal()">
      <div class="ws-icon" id="ws-badge-icon">👤</div>
      <div class="ws-info">
        <strong id="ws-display-title">Patient Portal</strong>
        <small id="ws-display-sub">Personal Care & Vault</small>
      </div>
      <span class="ws-chevron">▾</span>
    </div>

    <div class="nav-label" id="nav-group-label">Patient Workspace</div>
    <nav class="nav-list" id="sidebar-nav"></nav>

    <div class="sidebar-foot">
      <div class="user-card">
        <div class="user-avatar" id="user-avatar-initials">RV</div>
        <div>
          <strong style="display:block; font-size:12px;" id="user-display-name">Rahul Verma</strong>
          <small style="color:var(--brand-slate);" id="user-display-role">Verified Patient</small>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Wrap -->
  <div class="main-wrap">
    <header class="top-bar">
      <div>
        <div class="top-breadcrumb" id="header-breadcrumb">Patient Portal / Overview</div>
        <div class="top-title" id="header-greeting">Welcome, Rahul Verma</div>
      </div>
      <div class="top-actions">
        <div class="status-badge">
          <span class="status-dot"></span>
          <span>Verified Local Monolith</span>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="fetchState(true)">↻ Refresh</button>
      </div>
    </header>

    <main class="container" id="app-container">
      <!-- Dynamic Workspace Content rendered here -->
    </main>
  </div>
</div>

<!-- Modal Container -->
<div class="modal-backdrop" id="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal-card" id="modal-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h3 id="modal-title" style="margin:0; font-size:16px;">Action</h3>
      <button class="btn btn-secondary btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

  // State Loader
  async function fetchState(notify = false) {
    try {
      const [sRes, aRes] = await Promise.all([
        fetch('/api/v1/state'),
        fetch('/api/v1/audit')
      ]);
      appState = await sRes.json();
      auditState = await aRes.json();
      renderUI();
      if (notify) showToast('Platform state synced successfully.', 'success');
    } catch (e) {
      showToast('Error syncing platform state: ' + e.message, 'error');
    }
  }

  function showToast(msg, type = 'success') {
    const box = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<span>${type === 'success' ? '✓' : '⚠'}</span><span>${msg}</span>`;
    box.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
  }

  function openModal(title, html) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modal-backdrop').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-backdrop').classList.remove('open');
  }

  function switchWorkspace(wsKey) {
    activeWorkspace = wsKey;
    activeTab = WORKSPACES[wsKey].tabs[0].id;
    closeModal();
    renderUI();
  }

  function openWorkspaceModal() {
    const html = Object.entries(WORKSPACES).map(([k, v]) => `
      <div onclick="switchWorkspace('${k}')" style="display:flex; align-items:center; gap:12px; padding:12px; border:1px solid var(--brand-border); border-radius:10px; margin-bottom:8px; cursor:pointer; background: ${activeWorkspace === k ? 'var(--brand-coral-soft)' : 'white'};">
        <div style="font-size:20px;">${v.tabs[0].icon}</div>
        <div>
          <strong style="display:block; font-size:13px; color:var(--brand-midnight);">${v.title}</strong>
          <small style="color:var(--brand-slate); font-size:11px;">${v.sub}</small>
        </div>
      </div>
    `).join('');
    openModal('Switch Ecosystem Workspace', html);

  // Render Master UI
  function renderUI() {
    if (!appState) return;
    const ws = WORKSPACES[activeWorkspace];

    // Update Chrome
    document.getElementById('ws-display-title').textContent = ws.title;
    document.getElementById('ws-display-sub').textContent = ws.sub;
    document.getElementById('nav-group-label').textContent = ws.crumb;
    document.getElementById('header-breadcrumb').textContent = `${ws.crumb} / ${ws.tabs.find(t => t.id === activeTab)?.label || 'Overview'}`;
    document.getElementById('header-greeting').textContent = ws.greeting;
    document.getElementById('user-display-name').textContent = ws.name;
    document.getElementById('user-display-role').textContent = ws.role;
    document.getElementById('user-avatar-initials').textContent = ws.initials;

    // Render Navigation
    const nav = document.getElementById('sidebar-nav');
    nav.innerHTML = ws.tabs.map(t => `
      <button class="nav-btn ${activeTab === t.id ? 'active' : ''}" onclick="activeTab='${t.id}'; renderUI();">
        <span>${t.icon}</span>
        <span>${t.label}</span>
      </button>
    `).join('');

    // Render Main View
    const container = document.getElementById('app-container');
    if (activeWorkspace === 'PATIENT') container.innerHTML = renderPatientWorkspace();
    else if (activeWorkspace === 'DOCTOR') container.innerHTML = renderDoctorWorkspace();
    else if (activeWorkspace === 'HOSPITAL') container.innerHTML = renderHospitalWorkspace();
    else if (activeWorkspace === 'STAFF_HUB') container.innerHTML = renderStaffWorkspace();
    else if (activeWorkspace === 'CUSTOMER_CARE') container.innerHTML = renderCareWorkspace();

  }

  async function submitEncounter(aptId) {
    const notes = document.getElementById('soap-notes').value;
    const code = document.getElementById('icd-code').value;
    const med = document.getElementById('rx-med').value;

    try {
      const res = await fetch('/api/v1/encounters/sign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          appointmentId: aptId,
          clinicalNotes: notes,
          icd10DiagnosisCodes: [code],
          prescriptionItems: [{
            medicineName: med,
            genericName: med,
            dosageForm: 'TABLET',
            strength: '20 mg',
            frequency: 'OD HS',
            durationDays: 30
          }]
        })
      });
      const data = await res.json();
      if (data.success) {
        closeModal();
        showToast('Encounter digitally signed & prescription published.', 'success');
        await fetchState();
      }
    } catch (e) {
      showToast(e.message, 'error');
    }
  }

  async function validateLabOrder(orderId) {
    try {
      // Find or submit tech result first, then validate
      const techRes = await fetch('/api/v1/lis/results', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          labOrderId: orderId,
          patientId: PATIENT_ID,
          items: [{
            parameterName: 'Total Cholesterol',
            measuredValue: '215',
            units: 'mg/dL',
            referenceRange: '< 200',
            flag: 'ABNORMAL_HIGH',
            isCriticalPanic: false
          }]
        })
      });
      const techData = await techRes.json();
      const resultId = techData.result.id;

      const valRes = await fetch(`/api/v1/lis/results/${resultId}/validate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role: 'DOCTOR_RMP', userId: 'doc-path-01' })
      });
      const valData = await valRes.json();
      if (valData.success) {
        showToast('Lab result validated by pathologist & released to patient vault.', 'success');
        await fetchState();
      }
    } catch (e) {
      showToast(e.message, 'error');
    }
  }
