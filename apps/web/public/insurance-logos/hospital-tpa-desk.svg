    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0D9488" letter-spacing="0.2px">Hospital TPA &amp; Insurance Cell</text>
